[project]
name = "resumeevaluator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Surya Pratap Singh", email = "suryachaudhary.8449@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "groq>=1.7.0",
    "pathlib>=1.0.1",
    "pydantic>=2.14.1",
    "pypdf>=6.21.1",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
resumeevaluator = "resumeevaluator:main"

[build-system]
